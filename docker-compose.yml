# Agentic Cloud - Phase 3, Step 3.2
# Shared infrastructure:
#   postgres     Postgres 16 + pgvector (sessions, checkpoints, memories, credentials)
#   mcp-papers   MCP server: real arXiv search
#   mcp-notify   MCP server: mock notification provider that requires an API key
#
# Networks:
#   agentic-net  postgres + agent containers (agents are attached by the control plane)
#   tools-net    MCP servers ONLY. Agents are NOT on this network, so they cannot reach
#                the MCP servers by name. The control plane (on the host) reaches them
#                through the published localhost ports, and the servers additionally
#                require X-Gateway-Secret, which only the control plane knows.
#
# Secrets come from .env in this folder (Docker Compose reads it automatically):
#   MCP_GATEWAY_SECRET   shared between the control plane's gateway and the MCP servers
#   NOTIFY_ACCOUNTS      the mock provider's issued API keys ("key:account,key:account")
#
# Usage:
#   docker compose up -d --build
#   docker compose ps          (wait until all services show "healthy")
#   docker compose down        (stop; data stays in the volume)
#   docker compose down -v     (stop AND wipe all data)

services:
  postgres:
    # Same Postgres 16, plus the pgvector extension preinstalled
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_cloud
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migrations/002_memory.sql:/docker-entrypoint-initdb.d/02_memory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_cloud"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - agentic-net

  mcp-papers:
    build:
      context: ./mcp_servers
      dockerfile: papers/Dockerfile
    image: agentic-cloud/mcp-papers:phase3
    container_name: mcp-papers
    restart: unless-stopped
    environment:
      MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:?set MCP_GATEWAY_SECRET in .env}
      ARXIV_MIN_INTERVAL_S: "3.0"
      CACHE_TTL_S: "3600"
      ARXIV_TIMEOUT_S: "20"
      ARXIV_RETRIES: "2"          # retries on 429/503: wait Retry-After or 5 s, 10 s
      ARXIV_COOLDOWN_S: "60"      # then stop calling arXiv for 60 s (fail fast)
      PAPERS_FALLBACK: "mock"     # mock = clearly-labelled placeholder papers while arXiv refuses
                                  # none = return the error to the caller instead
    ports:
      - "127.0.0.1:9101:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tools-net

  mcp-notify:
    build:
      context: ./mcp_servers
      dockerfile: notify/Dockerfile
    image: agentic-cloud/mcp-notify:phase3
    container_name: mcp-notify
    restart: unless-stopped
    environment:
      MCP_GATEWAY_SECRET: ${MCP_GATEWAY_SECRET:?set MCP_GATEWAY_SECRET in .env}
      NOTIFY_ACCOUNTS: ${NOTIFY_ACCOUNTS:-}
    ports:
      - "127.0.0.1:9102:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tools-net

volumes:
  pgdata:

networks:
  agentic-net:
    # Fixed name so the control plane can attach agent containers to it
    name: agentic-net
    driver: bridge
  tools-net:
    name: tools-net
    driver: bridge