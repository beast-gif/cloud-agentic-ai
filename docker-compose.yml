# Agentic Cloud - Phase 2, Step 2.1
# Shared infrastructure: Postgres 16 WITH the pgvector extension
# (sessions table + LangGraph checkpoints + long-term memory vectors).
#
# The control plane runs on your host machine (python), and agent containers are started
# dynamically by the control plane through the Docker SDK. Both need to reach Postgres:
#   - control plane (host)      -> localhost:5432
#   - agent containers (Docker) -> postgres:5432 over the "agentic-net" network
#
# Init scripts in /docker-entrypoint-initdb.d run in alphabetical order, ONLY when the
# data volume is empty (first start):
#   01_init.sql    -> Phase 1 control-plane tables
#   02_memory.sql  -> Phase 2 long-term memory (pgvector)
#
# Usage:
#   docker compose up -d
#   docker compose ps          (wait until postgres shows "healthy")
#   docker compose down        (stop; data stays in the volume)
#   docker compose down -v     (stop AND wipe all data)

services:
  postgres:
    # Same Postgres 16, plus the pgvector extension preinstalled
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_cloud
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migrations/002_memory.sql:/docker-entrypoint-initdb.d/02_memory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_cloud"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - agentic-net

volumes:
  pgdata:

networks:
  agentic-net:
    # Fixed name so the control plane can attach agent containers to it
    name: agentic-net
    driver: bridge