# Agentic Cloud configuration (Phases 1-5)
# Read by the control plane (host) and passed to agent containers as environment variables.
# Secrets do NOT belong here: put them in .env (git-ignored), see .env.example.

project:
  name: agentic-cloud
  phase: 5

# ---------------------------------------------------------------------------
# Postgres (started by docker-compose.yml)
# ---------------------------------------------------------------------------
postgres:
  db: agentic_cloud
  user: agentic
  password: agentic_dev_pw
  # Control plane runs on the host -> reaches Postgres through the published port
  host_dsn: postgresql://agentic:agentic_dev_pw@localhost:5432/agentic_cloud
  # Agent containers run on the agentic-net network -> reach Postgres by service name
  container_dsn: postgresql://agentic:agentic_dev_pw@postgres:5432/agentic_cloud

# ---------------------------------------------------------------------------
# Docker settings for agent containers
# ---------------------------------------------------------------------------
docker:
  network: agentic-net              # must match the network name in docker-compose.yml
  agent_image: agentic-cloud/agent:phase1
  agent_internal_port: 8080         # FastAPI port inside every agent container
  bind_host: 127.0.0.1              # published ports only on localhost
  label: agentic-cloud.session      # label put on every agent container (for cleanup)
  memory_limit: 512m                # per-agent RAM limit (same as our snapshot math)
  cpu_limit: 1.0                    # 1 vCPU per agent

# ---------------------------------------------------------------------------
# Control plane API
# ---------------------------------------------------------------------------
control_plane:
  host: 127.0.0.1
  port: 8000
  # How AGENT CONTAINERS reach the control plane (Memory API).
  # host.docker.internal = your Windows host as seen from inside a Docker Desktop container.
  agent_facing_url: http://host.docker.internal:8000

# ---------------------------------------------------------------------------
# Session lifecycle (freeze / wake)
# ---------------------------------------------------------------------------
lifecycle:
  idle_timeout_s: 30                # WAITING longer than this -> freeze (stop container)
  reaper_interval_s: 5              # how often the idle reaper checks
  health_timeout_s: 60              # max time to wait for a new container's /health
  health_poll_ms: 100               # /health polling interval (sets wake-time resolution)

# ---------------------------------------------------------------------------
# Phase 5: where agents run
#   driver: docker       -> one Docker container per session (Phases 1-4)
#   driver: firecracker  -> one Firecracker microVM per session, RESTORED from golden.snap
#                           by fc-agent inside the fc-host Hyper-V VM (no boot, no imports)
#   The lifecycle (freeze/wake), gateway, memory and router work the same with both.
#
#   firecracker.agent_url : fc-agent in fc-host (fc-host IP - check after a Windows reboot:
#                           "ip -4 addr show eth0" inside fc-host)
#   secret_env            : name of the .env variable holding the shared fc-agent secret
#   {WIN_HOST}            : replaced INSIDE fc-host with the Windows address on the Hyper-V
#                           switch (bridge.ps1 forwards :5432 and :8000 there)
# ---------------------------------------------------------------------------
driver: firecracker
firecracker:
  agent_url: http://172.20.189.74:8090
  secret_env: FC_AGENT_SECRET
  golden: golden
  start_timeout_s: 90
  health_poll_ms: 50
  agent_dsn: postgresql://agentic:agentic_dev_pw@{WIN_HOST}:5432/agentic_cloud
  control_plane_url: http://{WIN_HOST}:8000

# ---------------------------------------------------------------------------
# LLM used by the demo agent
#   provider: mock   -> no LLM, deterministic fake answers (test the infrastructure only)
#   provider: ollama -> local model through Ollama running on your host
# ---------------------------------------------------------------------------
llm:
  provider: router                  # mock | ollama | router (Phase 4)
  router:
    timeout_s: 180
  ollama:
    # host.docker.internal = your Windows host, as seen from inside a Docker Desktop container
    base_url: http://host.docker.internal:11434
    model: llama3.1:8b
    temperature: 0.2
    timeout_s: 120

# ---------------------------------------------------------------------------
# Phase 2: long-term memory (L3)
#   The CONTROL PLANE computes embeddings (agents never do), so Ollama's URL here is
#   as seen from the host: localhost, not host.docker.internal.
#
#   min_score       : recall threshold (cosine similarity). It depends on the model:
#                     hashing vectors of related texts score much lower than real
#                     semantic embeddings, so each provider has its own value.
#   dedup_threshold : a new memory this similar to an existing one is treated as the
#                     same fact (merged instead of inserted).
# ---------------------------------------------------------------------------
memory:
  embeddings:
    provider: mock                  # mock | ollama
    dim: 768                        # must match vector(768) in db/migrations/002_memory.sql
    mock:
      min_score: 0.25
      dedup_threshold: 0.95
    ollama:
      base_url: http://localhost:11434
      model: nomic-embed-text
      timeout_s: 60
      use_prefixes: true            # "search_document: " / "search_query: " (nomic task prefixes)
      min_score: 0.60
      dedup_threshold: 0.95

# ---------------------------------------------------------------------------
# Phase 2: L2 workspace (one Docker volume per session, mounted on every start)
#   keep_after_complete_s : keep a finished session's files this long (for inspection),
#                           then the reaper deletes the volume. 0 = delete immediately.
#   gc_every_ticks        : how often the reaper runs workspace GC
#                           (12 ticks x reaper_interval_s 5 s = every 60 s)
# ---------------------------------------------------------------------------
workspace:
  mount_path: /workspace
  volume_prefix: ws-
  keep_after_complete_s: 3600
  gc_every_ticks: 12

# ---------------------------------------------------------------------------
# Phase 3: credential vault
#   The master key is a SECRET: it is NOT stored here. It is read from the
#   environment variable named below (put it in .env, which is git-ignored).
# ---------------------------------------------------------------------------
vault:
  master_key_env: VAULT_MASTER_KEY

# ---------------------------------------------------------------------------
# Phase 3: MCP gateway
#   servers  : backend MCP servers (published on localhost by docker-compose.yml)
#              credential = vault provider whose secret the gateway attaches as
#              "Authorization: Bearer <secret>" (agents never see it)
#   policies : per agent_type
#     allow        tools the agent can see and call ("<server>.<tool>"); everything
#                  else is invisible in tools/list and denied in tools/call
#     rules        argument rules; owner_only = the argument must equal the user's
#                  own owner_chat (vault metadata) and is filled in when missing
#     rate_limits  token bucket per server:
#                  tokens(t) = min(capacity, tokens + refill_per_s * dt), 1 token per call
#                  scope global  = shared by the whole platform (arXiv sees one IP)
#                  scope session = one bucket per session
# ---------------------------------------------------------------------------
mcp:
  gateway_secret_env: MCP_GATEWAY_SECRET
  request_timeout_s: 90             # papers may retry arXiv for a while
  tools_cache_s: 300                # re-read the servers' tools/list every 5 min
  servers:
    papers:
      url: http://127.0.0.1:9101/mcp
      credential: null
    notify:
      url: http://127.0.0.1:9102/mcp
      credential: notify
  policies:
    research:
      allow: [papers.search, papers.get, notify.send]
      rules:
        notify.send:
          to: owner_only
      rate_limits:
        papers: {capacity: 3, refill_per_s: 0.33, scope: global}
        notify: {capacity: 3, refill_per_s: 0.05, scope: session}

# ---------------------------------------------------------------------------
# Phase 4: model router (local Ollama vs cloud LLM)
#   The router runs in the CONTROL PLANE (host), so Ollama is reached at localhost.
#   The cloud key is NOT here and NOT in .env: it is stored in the vault as
#     user_id = platform, provider = velona      (PUT /admin/vault/platform/velona)
#
#   Velona bills in INR:  cost_inr = usd_price x usd_inr x 1.005 (forex buffer) x 1.07 (platform fee)
#   Fill in the cloud model's USD prices per million tokens from Velona's model page
#   and today's USD/INR rate to get rupee costs; leave null to report tokens only.
# ---------------------------------------------------------------------------
router:
  mode: cascade
  budget_inr_per_session: 5
  local:
    base_url: http://localhost:11434
    embed_model: nomic-embed-text
    chat_model: qwen2.5:1.5b                # summaries fallback / local mode (not used for scoring)
    keep_alive: 30m                         # keep models in RAM (a cold load cost ~7 s)
    timeout_s: 180
    models: [qwen2.5:1.5b, llama3.2:3b]     # only used by benchmarks/llm_probe.py
  rank:
    calibration: {cos_low: 0.52, score_low: 1.09, cos_high: 0.76, score_high: 8.92}
    uncertain_band: [0.60, 0.68]
    cut_gap: 1.5
    max_cloud_calls: 6
    cloud_parallel: 4
    embed_chars: 1600
    cache_items: 5000
    latency_budget_ms: 10000            # cascade only; null = never switch to the cloud for speed
    embed_ms_per_item_initial: 1200     # starting estimates, then learned from real calls
    cloud_ms_per_call_initial: 1400
    warm_cache_in_background: true
    recalibrate: true
    recalibrate_min_pairs: 2
    recalibrate_max_shift: 5.0
  cloud:
    provider: velona
    url: https://velona.in/v1/chat/completions
    model: anthropic/claude-haiku-5.5
    vault_user: platform
    vault_provider: velona
    timeout_s: 60
    score_max_tokens: 64
    summary_max_tokens: 300
    generic_max_tokens: 400
    retry_multiplier: 4
    price_usd_per_mtok: {input: 0.10, output: 0.50}
    usd_inr: 96.0
    forex_buffer: 1.005
    platform_fee: 1.07

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO